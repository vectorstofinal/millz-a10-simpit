server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml application/rss+xml text/plain application/octet-stream;
  gzip_min_length 1024;


  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /files/  { add_header Cache-Control "public, max-age=3600"; add_header Access-Control-Allow-Origin "*"; }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
  error_page 404 /404.html;
}
